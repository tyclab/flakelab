# flakelab's tmux: the server that hosts agent sessions (`flakelab sessions
# --start`), so a Claude Code, Codex or Kiro session outlives the terminal it
# was started from. Kept to defaults a guest already knows: no prefix change,
# no rebinding; only what a long-running agent session needs.

# A session's scrollback is the record of a long run; the default 2000 lines
# is a few tool calls.
set -g history-limit 200000

# Mouse: scroll the agent's output and pick a window with a click, the way a
# terminal tab behaves. Shift+select still copies through the terminal.
set -g mouse on

# The window title is set by the starter (tool-directory) and must not be
# rewritten by the shell's title escape sequences.
set -g allow-rename off
set -g automatic-rename off

# Closing a window renumbers the rest, so the window list never has holes.
set -g renumber-windows on

# Terminal title = the window, so a tab attached to a view shows what it holds.
set -g set-titles on
set -g set-titles-string '#W'

# No wait after Escape: agent TUIs use it as a key of its own.
set -s escape-time 0

# 24-bit colour through the terminals this environment sees (Windows Terminal,
# mosh, ssh clients on a phone); tmux-256color is what the agents' TUIs probe.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',*:RGB'

# A detached view (an --attach or --open session grouped with `agents`) is
# destroyed when its last client leaves; the agents session itself keeps the
# default and outlives every client.
set -g destroy-unattached off

# One blue accent, the dashboard's (files/config/web/index.html), where tmux
# would show its green: the status line, the current window, the active pane
# border, the copy-mode selection and the message line.
set -g status-style 'bg=#1565c0,fg=#ffffff'
set -g window-status-style 'fg=#e6f0fb'
set -g window-status-current-style 'bg=#0b1a2b,fg=#ffffff,bold'
set -g pane-active-border-style 'fg=#1565c0'
set -g message-style 'bg=#1565c0,fg=#ffffff'
set -g mode-style 'bg=#5aa0ea,fg=#0b1a2b'
set -g clock-mode-colour '#1565c0'
