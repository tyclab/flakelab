<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flakelab</title>
<style>
  /* Dark mode's lighter accent takes dark text, so filled buttons and tags keep their contrast. */
  :root { --bg: #f6f6f4; --fg: #1a1a1a; --mut: #6b6b6b; --line: #ddd; --card: #fff;
          --accent: #1565c0; --accent-fg: #fff; --accent-soft: #e6f0fb; --accent-ring: rgba(21, 101, 192, .35);
          --ok: var(--accent); --warn: #b26a00; --bad: #c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151515; --fg: #ececec; --mut: #9a9a9a; --line: #333; --card: #1e1e1e;
          --accent: #5aa0ea; --accent-fg: #0b1a2b; --accent-soft: #16283d; --accent-ring: rgba(90, 160, 234, .45); } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 12px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  h1::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--accent); align-self: center; }
  h1 small { color: var(--mut); font-weight: normal; font-size: 13px; }
  /* A configured logo (web.logo) stands where the accent square would. */
  h1 img.logo { width: 24px; height: 24px; border-radius: 6px; align-self: center; }
  h1.logo::before { display: none; }
  h2 { font-size: 13px; margin: 20px 0 8px; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-ring); }
  a:hover { border-bottom-color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  th { color: var(--mut); font-weight: 600; border-bottom: 2px solid var(--accent-soft); }
  tbody tr:hover { background: var(--accent-soft); }
  td.wrap { white-space: normal; }
  .bar { display: inline-block; width: 90px; height: 8px; background: var(--line); border-radius: 4px; vertical-align: middle; margin-right: 6px; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: var(--ok); }
  .bar.warn i { background: var(--warn); } .bar.bad i { background: var(--bad); }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 12px; background: var(--line); margin-right: 4px; }
  .tag.active { background: var(--accent); color: var(--accent-fg); } .tag.profile { background: var(--warn); color: #fff; } .tag.q { background: var(--bad); color: #fff; }
  button, input, select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); }
  input:focus, select:focus, button:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
  /* Outline buttons act; filled ones commit (a switch, a start, the token). */
  button { cursor: pointer; color: var(--accent); border-color: var(--accent); }
  button:hover { background: var(--accent-soft); }
  button[type="submit"], button.primary { background: var(--accent); color: var(--accent-fg); }
  button[type="submit"]:hover, button.primary:hover { filter: brightness(1.1); background: var(--accent); }
  button:disabled { opacity: .5; cursor: default; filter: none; }
  form.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  pre { margin: 0; white-space: pre-wrap; font-size: 13px; }
  .mut { color: var(--mut); } .err { color: var(--bad); }
  #log { max-height: 240px; overflow: auto; }
  #settings input[type="range"] { width: 140px; padding: 0; vertical-align: middle; }
  #settings input[type="number"] { width: 90px; }
  .tag.runtime { background: var(--warn); color: #fff; }
  code { font-size: 13px; background: var(--accent-soft); padding: 0 4px; border-radius: 4px; }
</style>
</head>
<body>
<h1><img id="logo" class="logo" alt="" hidden>flakelab <small id="clock"></small> <small><a id="terminal" href="#" hidden>terminal ↗</a></small></h1>

<div class="card" id="auth" hidden>
  <form class="row" id="tokenform">
    <label>token <input id="token" type="password" size="40" autocomplete="off"></label>
    <button type="submit">use</button>
    <span class="mut">from <code>flakelab web --print-token</code> on the box; kept in this browser only</span>
  </form>
</div>

<h2>accounts</h2>
<div class="card">
  <table id="accounts"><thead><tr><th>#</th><th>email</th><th>alias</th><th>state</th><th>usage</th><th></th></tr></thead><tbody></tbody></table>
  <p class="row" style="margin:10px 0 0"><span class="mut">tycswap's roster; thresholds and strategy are <code>tycswap config</code></span></p>
</div>

<h2>sessions</h2>
<div class="card">
  <table id="sessions"><thead><tr><th>tool</th><th>pid</th><th>age</th><th>session</th><th>host</th><th>directory</th></tr></thead><tbody></tbody></table>
  <form class="row" id="start" style="margin-top:10px">
    <select id="tool"><option>claude</option><option>codex</option></select>
    <input id="dir" placeholder="/home/you/git/project" size="36" required>
    <button type="submit">start in tmux</button>
    <span class="mut">then <code>flakelab sessions --attach</code>, or the terminal</span>
  </form>
</div>

<h2>log</h2>
<div class="card" id="log"><pre id="logtext" class="mut">—</pre></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  let token = "";
  try { token = localStorage.getItem("flakelab.token") || ""; } catch (e) {}
  const log = (line, err) => {
    const t = new Date().toLocaleTimeString();
    const pre = $("#logtext");
    pre.classList.remove("mut");
    pre.textContent = `${t}  ${line}\n` + (pre.textContent === "—" ? "" : pre.textContent);
    if (err) pre.classList.add("err"); else pre.classList.remove("err");
  };
  const api = async (path, body) => {
    const r = await fetch(path, {
      method: body === undefined ? "GET" : "POST",
      headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    if (r.status === 401) { $("#auth").hidden = false; throw new Error("token needed"); }
    const doc = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(doc.error || (doc.call && doc.call.stderr) || ("HTTP " + r.status));
    return doc;
  };
  // Everything from the API is text from the tools and the file system (a
  // label, an error message, a directory name): escaped before it meets
  // innerHTML, since this page holds the token.
  const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const age = (s) => (s == null ? "" : s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m` : `${Math.floor(s / 3600)}h`);
  // Time to a window's reset: minutes, hours or days; "now" once it passed.
  const left = (s) => (s == null ? "" : s <= 0 ? "now" : s < 3600 ? `${Math.floor(s / 60)}m` : s < 86400 ? `${Math.floor(s / 3600)}h` : `${Math.floor(s / 86400)}d`);
  const barFor = (label, w, now) => {
    const p = Math.max(0, Math.min(100, Math.round(Number(w.pct) || 0)));
    const cls = p >= 95 ? "bad" : p >= 85 ? "warn" : "";
    const at = w.resetsAt ? Math.floor(Date.parse(w.resetsAt) / 1000) : null;
    const reset = at == null || Number.isNaN(at) ? "" : `<span class="mut"> · resets in ${left(at - now)}</span>`;
    return `<span class="bar ${cls}"><i style="width:${p}%"></i></span>${esc(label)} ${p}%${reset}`;
  };
  // tycswap's usage object: the 5h and 7d windows and the per-model weeks.
  const windowsOf = (u) => {
    if (!u) return [];
    const ws = [];
    if (u.fiveHour) ws.push(["5h", u.fiveHour]);
    if (u.sevenDay) ws.push(["7d", u.sevenDay]);
    for (const s of (u.scoped || [])) ws.push([s.name, s]);
    return ws;
  };

  const render = (st) => {
    const now = Math.floor(Date.now() / 1000);
    const tb = $("#accounts tbody"); tb.innerHTML = "";
    for (const a of ((st.accounts && st.accounts.accounts) || [])) {
      const tags = [];
      if (a.active) tags.push('<span class="tag active">active</span>');
      if (a.disabled) tags.push('<span class="tag">disabled</span>');
      if (a.atLimit) tags.push(`<span class="tag q">at limit: ${esc((a.limitingWindows || []).join(", "))}</span>`);
      const wins = windowsOf(a.usage).map(([l, w]) => barFor(l, w, now)).join("<br>")
        || (a.usageStatus && a.usageStatus !== "ok" ? `<span class="err">${esc(a.usageStatus)}</span>` : "—");
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${esc(String(a.number))}</td><td>${esc(a.email)}</td><td>${esc(a.alias || "")}</td><td class="wrap">${tags.join("")}</td><td class="wrap">${wins}</td><td></td>`;
      const btn = document.createElement("button");
      btn.className = "primary";
      btn.textContent = "switch";
      btn.disabled = !!a.active || !!a.disabled;
      btn.onclick = async () => {
        btn.disabled = true;
        try { const r = await api("/api/switch", { entry: String(a.number) }); log((r.call.stdout || "").trim() || `switched to ${a.number}`); }
        catch (e) { log(`switch ${a.number}: ${e.message}`, true); }
        refresh();
      };
      tr.lastElementChild.appendChild(btn);
      tb.appendChild(tr);
    }
    const sb = $("#sessions tbody"); sb.innerHTML = "";
    for (const s of (st.sessions || [])) {
      const host = s.host ? (s.host.window || s.host.session) : "—";
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${esc(s.tool)}</td><td>${esc(s.pid)}</td><td>${esc(s.age)}</td><td><code>${esc(s.session || "—")}</code></td><td>${esc(host)}</td><td class="wrap">${esc(s.dir || s.cwd)}</td>`;
      sb.appendChild(tr);
    }
    $("#terminal").hidden = !st.terminal;
    $("#clock").textContent = new Date().toLocaleTimeString();
  };

  const refresh = async () => {
    try { render(await api("/api/state")); $("#auth").hidden = true; }
    catch (e) { if (e.message !== "token needed") log(`state: ${e.message}`, true); }
  };

  // The logo needs no token, like the page: shown, and made the tab icon,
  // when the server has one.
  fetch("/api/health").then((r) => r.json()).then((h) => {
    if (!h.logo) return;
    $("#logo").src = "/logo"; $("#logo").hidden = false;
    document.querySelector("h1").classList.add("logo");
    const link = document.createElement("link");
    link.rel = "icon"; link.href = "/logo";
    document.head.appendChild(link);
  }).catch(() => {});

  $("#tokenform").onsubmit = (ev) => {
    ev.preventDefault();
    token = $("#token").value.trim();
    try { localStorage.setItem("flakelab.token", token); } catch (e) {}
    refresh();
  };
  // The terminal tab cannot carry the bearer: the server issues it a
  // session cookie, scoped to /terminal, against the token first.
  $("#terminal").onclick = async (ev) => {
    ev.preventDefault();
    try { await api("/api/terminal", {}); window.open("/terminal/", "_blank"); }
    catch (e) { log(`terminal: ${e.message}`, true); }
  };
  $("#start").onsubmit = async (ev) => {
    ev.preventDefault();
    try {
      const r = await api("/api/sessions/start", { tool: $("#tool").value, dir: $("#dir").value.trim() });
      log((r.call.stdout || r.call.stderr || "started").trim());
    } catch (e) { log(`start: ${e.message}`, true); }
    refresh();
  };

  refresh();
  // A hidden tab asks for nothing; it catches up when shown.
  setInterval(() => { if (!document.hidden) refresh(); }, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
