---
name: tycswap pin

# .github/scripts/tycswap_pin.py moves flake.nix's pin to a new tycswap release in a
# self-merging pull request. Polled: tyclab/tycswap holds no credential that could
# start this run; a tick with nothing to do ends after the plan step.
on:
  schedule:
    # Off the top of the hour, the time GitHub delays scheduled runs most.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

# GitHub holds ci.yml's pull_request run of a pull request this token opens until it
# is approved; the script approves it (actions: write), and its lint, test and gitleaks
# are what main's ruleset reads. A workflow_dispatch run of ci.yml on the branch
# reports the same checks on the head, yet left #450 blocked. contents: write pushes
# the pin branch; pull-requests: write opens, closes and arms the pull request.
permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: tycswap-pin
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/tycswap_pin.py plan

      - if: steps.plan.outputs.action == 'pin'
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - if: steps.plan.outputs.action != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/tycswap_pin.py act
