---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      # `nix develop` appends the host PATH, so the node and go hooks resolve the
      # runner's toolchains while the rest comes from the dev shell's pinned versions.
      # Not `make lint-nix`: the test job's `nix flake check` builds those linters.
      - run: nix develop -c bash -c 'make lint && nix fmt && git diff --exit-code'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      # No `--no-build`: this must run the suites, not only evaluate them.
      - run: nix flake check --print-build-logs

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      # History, not the working tree, which the pre-commit hook covers - and that
      # hook is skippable. From packages.gitleaks, so the version is the locked one.
      - run: nix run .#gitleaks -- git . --redact --no-banner --log-level error
