---
# Pre-commit hook suite; `make lint` runs it over the whole tree, as CI does.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      # Not the upstream `gitleaks git --staged`, which is a green over zero bytes
      # under --all-files. One path at a time: given several, `gitleaks dir` ignores
      # them all and scans the whole working tree. History is CI's `gitleaks` job.
      - id: gitleaks
        # `--config` is required: gitleaks resolves .gitleaks.toml relative to the scan
        # target, so with file paths every repo's allowlist is silently discarded.
        entry: sh -c 'cfg=; if [ -f .gitleaks.toml ]; then cfg="--config .gitleaks.toml"; fi; printf "%s\0" "$@" | xargs -0 -n1 -P4 gitleaks dir $cfg --redact --verbose --no-banner --log-level error' --
        pass_filenames: true

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: b82a6c8896e491b9cb377a99ff3412131920681b  # frozen: v0.23.2
    hooks:
      - id: markdownlint-cli2
        language_version: system

  # Not koalaman/shellcheck-precommit: a docker_image hook fails in CI runners
  # without a Docker daemon.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        # shellcheck supports sh/bash/dash/ksh only (SC1071).
        exclude_types: [zsh]

  # Without this, the zsh scripts excluded above are linted by nothing at all.
  - repo: local
    hooks:
      - id: zsh-syntax
        name: zsh -n (syntax check zsh scripts)
        entry: zsh -n
        language: system
        types: [zsh]
        require_serial: false

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 0ee178619d696787ca73d210cc191d720868c631  # frozen: v3.9.6
    hooks:
      - id: prettier
        types_or: [markdown, json]
        language_version: system

  # Narrow select on purpose: E9 + F are the defect rules, so each red is a new
  # defect rather than a taste argument.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: aab412d509121cb5f7533134b7e67f9fab59c682  # frozen: v0.16.4
    hooks:
      - id: ruff-check
        args: [--select, "E9,F"]
